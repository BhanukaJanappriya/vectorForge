name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System dependencies (Inkscape, potrace, Ghostscript, cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            inkscape potrace ghostscript libcairo2 libcairo2-dev pkg-config
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: OpenAPI spec is up to date
        run: python scripts/export_openapi.py --check
      - name: Pytest (with coverage)
        run: python -m pytest -q --cov=pipeline --cov=api --cov=eval --cov-report=term
      - name: Slow / timing tests
        run: python -m pytest -q -m slow

  frontend:
    name: Frontend (lint, unit tests, build, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker compose build + smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Convert a sample through nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/v1/health
          job=$(curl -fsS -F "file=@samples/01_logo_4color.png" http://localhost:8080/api/v1/convert | python3 -c "import sys,json;print(json.load(sys.stdin)['job_id'])")
          for i in $(seq 1 120); do
            status=$(curl -fsS "http://localhost:8080/api/v1/jobs/$job" | python3 -c "import sys,json;print(json.load(sys.stdin)['status'])")
            [ "$status" = succeeded ] && break
            [ "$status" = failed ] && { curl -fsS "http://localhost:8080/api/v1/jobs/$job"; exit 1; }
            sleep 1
          done
          [ "$status" = succeeded ]
          for kind in svg ai eps png original; do
            curl -fsS -o /dev/null "http://localhost:8080/api/v1/jobs/$job/files/$kind"
          done
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
