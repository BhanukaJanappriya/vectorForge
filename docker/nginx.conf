# Serves the built SPA and proxies /api to the backend service (same origin, so no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Slightly above MAX_UPLOAD_BYTES (20 MiB) + multipart overhead, so the backend decides
    # 413s with the spec's JSON error body; anything larger is rejected here (also as JSON).
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads straight to the backend (it enforces the size limit while streaming).
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Backend responses keep their own headers (CSP on SVG, nosniff on files).
    }

    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"too_large","message":"Request exceeds the upload limit.","stage":"upload"}}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
